name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modx
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: pdo_mysql, mysqli, gd, zip, json, xml, mbstring, curl
          tools: composer
          coverage: none

      - name: Download MODX 2.8.8-pl
        run: |
          curl -fsSL -o modx.zip https://modx.s3.amazonaws.com/releases/2.8.8/modx-2.8.8-pl.zip
          unzip -q modx.zip
          mv modx-2.8.8-pl modx
          rm modx.zip

      - name: Install MODX (CLI)
        working-directory: modx
        run: |
          MODX_ROOT="${GITHUB_WORKSPACE}/modx"
          cat > setup/config.xml <<XML
          <modx>
            <database_type>mysql</database_type>
            <database_server>127.0.0.1</database_server>
            <database>modx</database>
            <database_user>root</database_user>
            <database_password>root</database_password>
            <database_connection_charset>utf8mb4</database_connection_charset>
            <database_charset>utf8mb4</database_charset>
            <database_collation>utf8mb4_unicode_ci</database_collation>
            <table_prefix>modx_</table_prefix>
            <https_port>443</https_port>
            <http_host>localhost</http_host>
            <inplace>0</inplace>
            <unpacked>0</unpacked>
            <language>en</language>
            <cmsadmin>admin</cmsadmin>
            <cmspassword>AdminAdmin1</cmspassword>
            <cmsadminemail>admin@example.com</cmsadminemail>
            <core_path>${MODX_ROOT}/core/</core_path>
            <context_mgr_path>${MODX_ROOT}/manager/</context_mgr_path>
            <context_mgr_url>/manager/</context_mgr_url>
            <context_connectors_path>${MODX_ROOT}/connectors/</context_connectors_path>
            <context_connectors_url>/connectors/</context_connectors_url>
            <context_web_path>${MODX_ROOT}/</context_web_path>
            <context_web_url>/</context_web_url>
            <remove_setup_directory>0</remove_setup_directory>
          </modx>
          XML
          # Trim leading indentation that heredoc indentation may leave on the root tag line
          sed -i 's/^[[:space:]]*//' setup/config.xml
          php setup/index.php --installmode=new --config="${MODX_ROOT}/setup/config.xml"
          test -f core/config/config.inc.php

      - name: Install root dependencies
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Install component Phinx deps
        run: composer install --no-interaction --no-dev --prefer-dist
        working-directory: core/components/sendex

      - name: Disable local auto-install for release build
        run: sed -i 's/define('\''PKG_AUTO_INSTALL'\'', true);/define('\''PKG_AUTO_INSTALL'\'', false);/' _build/build.config.php

      - name: Build transport package
        env:
          MODX_BASE_PATH: ${{ github.workspace }}/modx/
        run: php _build/build.transport.php

      - name: Collect transport package
        run: |
          mkdir -p _packages
          find . -name 'sendex-*.transport.zip' -not -path './.git/*' -exec cp -t _packages {} +
          ls -la _packages/
          test -n "$(ls _packages/sendex-*.transport.zip 2>/dev/null)"
          python3 - <<'PY'
          import glob, sys, zipfile
          zpath = glob.glob('_packages/sendex-*.transport.zip')[0]
          needle = b'xPDO\\Transport\\xPDOObjectVehicle'
          with zipfile.ZipFile(zpath) as zf:
              for name in zf.namelist():
                  if needle in zf.read(name):
                      print(f'ERROR: namespaced vehicle class in {name}', file=sys.stderr)
                      sys.exit(1)
          print('OK: no namespaced xPDOObjectVehicle in', zpath)
          PY

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {print; show=1; next}
            show && /^## \[/ {exit}
            show {print}
          ' core/components/sendex/docs/changelog.txt > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: _packages/*.transport.zip
          body_path: release-notes.md
